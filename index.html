<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şahin Şanlı — Mobil Geliştirici</title>
<meta name="description" content="Şahin Şanlı — iOS & Flutter developer, QA test automation. Karadeniz Technical University Software Engineering graduate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
</head>
<body>

<!-- WebGL background: raymarched crystal journey -->
<canvas id="bg" aria-hidden="true"></canvas>

<!-- UI overlay fragment (sections, nav, loading) injected by integrator -->
<div id="ui-root"></div>
<script src="shader-loader.js"></script>
<script>
/* inject UI fragment, THEN load ui.js so it initializes after DOM exists */
(function () {
  var root = document.getElementById('ui-root');
  fetch('ui.html')
    .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
    .then(function (html) { root.innerHTML = html; })
    .catch(function (e) {
      console.error('ui.html inject failed', e);
      root.innerHTML = '<p style="color:#f2f2f7;padding:2rem">UI yüklenemedi.</p>';
    })
    .then(function () {
      var s = document.createElement('script');
      s.src = 'ui.js';
      document.body.appendChild(s);
    });
})();
</script>
<script src="main.js"></script>
</body>
</html>
